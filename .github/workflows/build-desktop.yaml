# SPDX-License-Identifier: AGPL-3.0-or-later
name: build desktop

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel label (stable or canary)'
        required: false
        type: choice
        options:
          - stable
          - canary
        default: stable
      platforms:
        description: 'Platforms to build: windows, macos, linux, or all'
        required: false
        default: 'windows,macos'
        type: string
      version:
        description: 'Version number to stamp into the build (e.g. 1.2.0)'
        required: false
        default: ''
        type: string
      targets:
        description: 'Windows build targets (e.g. nsis, or nsis,portable,zip)'
        required: false
        default: 'nsis,portable,zip'
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CHANNEL: ${{ inputs.channel || 'stable' }}

jobs:
  build-windows:
    name: Build Windows (x64)
    if: contains(inputs.platforms || 'windows', 'windows') || contains(inputs.platforms, 'all')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            fluxer_desktop/native/rust
            fluxer_desktop/native/hardware-encoder
            fluxer_desktop/native/webauthn
            fluxer_desktop/native/win-clipboard
            fluxer_desktop/native/win-game-capture
            fluxer_desktop/native/win-process-loopback
            fluxer_desktop/native/win-shell
            fluxer_desktop/native/win-toast

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Desktop (main, preload, and native addons)
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
        run: pnpm build

      - name: Package Windows Desktop
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
          FLUXER_WIN_TARGETS: ${{ inputs.targets || 'nsis,portable,zip' }}
          ELECTRON_ARCH: x64
          VERSION: ${{ inputs.version || '' }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --win --x64

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-desktop-windows-x64
          path: |
            fluxer_desktop/dist-electron/*.exe
            fluxer_desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon arm64)
    if: contains(inputs.platforms || 'macos', 'macos') || contains(inputs.platforms, 'all')
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Desktop (main, preload, and native addons)
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
        run: pnpm build

      - name: Package macOS Desktop
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VERSION: ${{ inputs.version || '' }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac dmg zip --arm64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-desktop-macos-arm64
          path: |
            fluxer_desktop/dist-electron/*.dmg
            fluxer_desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux (x64)
    if: contains(inputs.platforms || '', 'linux') || contains(inputs.platforms, 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-dev libxrandr-dev \
            libdbus-1-dev libudev-dev libpipewire-0.3-dev libpulse-dev libclang-dev clang cmake \
            libfido2-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Desktop (main, preload, and native addons)
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
        run: pnpm build

      - name: Package Linux Desktop (AppImage)
        working-directory: fluxer_desktop
        env:
          BUILD_CHANNEL: ${{ env.BUILD_CHANNEL }}
          FLUXER_SKIP_GLIBC_CHECK: 'true'
          VERSION: ${{ inputs.version || '' }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --linux AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxer-desktop-linux-x64
          path: |
            fluxer_desktop/dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 7
