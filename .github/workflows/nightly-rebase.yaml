name: Nightly Rebase & AI Conflict Resolver

# SCHEDULING NOTE:
# GitHub Actions disables `on: schedule` triggers on forked repositories at the
# platform level. Since this repo is a public fork of fluxerapp/fluxer, cron
# schedules defined here will NEVER fire regardless of workflow state.
#
# Nightly runs are instead triggered by a cron schedule in the standalone
# (non-fork) repository: chiaracoetzee/workflow-scheduler
# That repo dispatches this workflow daily at 4:15 AM PDT (11:15 UTC) via
# `gh workflow run`.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (rebase and run tests, but do NOT push to remote)'
        required: true
        default: false
        type: boolean
      force_test_agent:
        description: 'Run self-test on Gemini 3.8 Flash API connectivity'
        required: false
        default: false
        type: boolean
      force_tests:
        description: 'Force execution of baseline, unit, and E2E tests even if 0 commits behind upstream'
        required: false
        default: false
        type: boolean
      skip_e2e:
        description: 'Skip full-stack Playwright E2E test gate'
        required: false
        default: false
        type: boolean
      skip_baseline_e2e:
        description: 'Skip pre-rebase baseline E2E gate only'
        required: false
        default: false
        type: boolean
      smoke:
        description: 'Smoke run: skip the baseline gates, rebase and regenerate, then stop before the test gates. Never pushes.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  nightly-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 160

    steps:
      - name: Checkout tyne
        uses: actions/checkout@v4
        with:
          ref: tyne
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout shared rebase tools
        uses: actions/checkout@v4
        with:
          repository: tyne-chat/tyne-tools
          ref: main
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: .shared_tools

      - name: Stage shared rebase tools to /tmp
        run: |
          mkdir -p /tmp/rebase_tools
          cp -r .shared_tools/* /tmp/rebase_tools/
          rm -rf .shared_tools

      - name: Set up Python for AI Resolver
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Antigravity SDK
        run: pip install google-antigravity

      - name: Verify Gemini Flash API Connectivity
        if: ${{ inputs.force_test_agent == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python /tmp/rebase_tools/rebase/rebase_agent.py --self-test
          echo "Resting 10s to ensure clean quota before rebase..."
          sleep 10

      - name: Set up Rust (WASM target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # On a night with nothing to rebase nothing is installed, so the pnpm store does not
      # exist, and the cache step of "Set up Node.js" then fails the whole job at cleanup.
      - name: Make sure the pnpm store exists
        run: mkdir -p "$(pnpm store path --silent)"

      - name: Free Disk Space for Docker Images
        run: |
          echo "Freeing disk space on runner for Docker builds & Playwright..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Runtime Token for Docker BuildKit
        uses: crazy-max/ghaction-github-runtime@v3

      # The pipeline runs as one step per phase, so this page shows which phase is
      # running, how long each took, and whether the repair agent was needed (its
      # steps are skipped when it was not). The phases share their state through
      # /tmp/rebase_pipeline_state.json; see rebase_orchestrator.py --phase.
      - name: Pipeline settings
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.force_tests }}" = "true" ] || [ "${{ inputs.force_test_agent }}" = "true" ]; then
            FLAGS="$FLAGS --force-tests"
          fi
          if [ "${{ inputs.skip_e2e }}" = "true" ]; then
            FLAGS="$FLAGS --skip-e2e"
          fi
          if [ "${{ inputs.skip_baseline_e2e }}" = "true" ]; then
            FLAGS="$FLAGS --skip-baseline-e2e"
          fi
          if [ "${{ inputs.smoke }}" = "true" ]; then
            FLAGS="$FLAGS --skip-baseline --stop-after-codegen"
          fi
          echo "REBASE_ARGS=--profile subprofiles --time-budget-minutes 150 $FLAGS" >> "$GITHUB_ENV"

      - name: "1. Check upstream and tag a backup"
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase prepare

      - name: "2. Baseline tests (before the rebase)"
        id: baseline
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase baseline

      - name: "3. Rebase onto upstream"
        id: rebase
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase rebase

      - name: "3a. Agent: resolve conflicts"
        id: resolve_conflicts
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.rebase.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase resolve-conflicts

      - name: "4. Dependencies and code generation"
        id: codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase codegen

      - name: "4a. Agent: repair code generation"
        id: repair_codegen
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.codegen.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-codegen

      - name: "5. Tests and analysis"
        id: unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase unit

      - name: "5a. Agent: repair tests"
        id: repair_unit
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.unit.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-unit

      - name: "6. End-to-end tests"
        id: e2e
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase e2e

      - name: "6a. Agent: repair end-to-end tests"
        id: repair_e2e
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' && steps.e2e.outputs.needs_agent == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase repair-e2e

      - name: "7. Push and start the next repository"
        id: push
        if: ${{ steps.prepare.outputs.skip_rebase != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python /tmp/rebase_tools/rebase/rebase_orchestrator.py $REBASE_ARGS --phase push

      - name: Upload E2E Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          if-no-files-found: ignore
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Upload AI Agent Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-agent-logs
          if-no-files-found: ignore
          path: |
            /tmp/rebase_transcript.md
            /tmp/rebase_escalation_reason.md
            /tmp/test_failures.log
            /tmp/e2e_failures.log
            /tmp/antigravity_data
