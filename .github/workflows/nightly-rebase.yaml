# SPDX-License-Identifier: AGPL-3.0-or-later
name: Nightly Rebase & AI Conflict Resolver

on:
  schedule:
    # 4:15 AM PDT (11:15 UTC) / 3:15 AM PST (12:15 UTC)
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (rebase and run tests, but do NOT push to remote)'
        required: true
        default: true
        type: boolean
      force_test_agent:
        description: 'Run self-test on Gemini 3.8 Flash API connectivity'
        required: false
        default: false
        type: boolean
      verify_push_permissions:
        description: 'Test remote write & workflow push permissions on a scratch branch'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  nightly-rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout automation tools
        uses: actions/checkout@v4
        with:
          path: automation-tools

      - name: Cache rebase agent script
        run: |
          mkdir -p /tmp/rebase_tools
          cp automation-tools/scripts/rebase/rebase_agent.py /tmp/rebase_tools/
          chmod +x /tmp/rebase_tools/rebase_agent.py
          rm -rf automation-tools

      - name: Set up Python for AI Resolver
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Antigravity SDK
        run: pip install google-antigravity

      - name: Verify Gemini Flash API Connectivity
        if: ${{ inputs.force_test_agent == true }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python /tmp/rebase_tools/rebase_agent.py --self-test
          echo "Resting 10s to ensure clean quota before rebase..."
          sleep 10

      - name: Checkout features/subprofiles
        uses: actions/checkout@v4
        with:
          ref: features/subprofiles
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity & Remotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fluxerapp/fluxer.git || git remote set-url upstream https://github.com/fluxerapp/fluxer.git
          git fetch upstream main
          git fetch origin features/subprofiles

      - name: Check for upstream changes
        id: check_upstream
        run: |
          COMMITS_BEHIND=$(git rev-list HEAD..upstream/main --count)
          echo "Commits behind upstream/main: $COMMITS_BEHIND"
          echo "commits_behind=$COMMITS_BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$COMMITS_BEHIND" -eq 0 ] && [ "${{ inputs.force_test_agent }}" != "true" ]; then
            echo "Branch is already up to date with upstream/main. Nothing to rebase."
            echo "skip_rebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_rebase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Git & Workflow Push Permissions
        if: inputs.verify_push_permissions == true && steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Verifying remote write and workflow permissions on a temporary scratch branch..."
          TEST_BRANCH="tmp/write-check-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$TEST_BRANCH"

          # Create a dummy commit that modifies a workflow file to explicitly test workflow scope
          mkdir -p .github/workflows
          echo "# Permission test at $(date)" > .github/workflows/permission-check.yaml
          git add .github/workflows/permission-check.yaml
          git commit -m "ci: verify workflow write permissions [skip ci]"

          set +e
          PUSH_OUT=$(git push origin "$TEST_BRANCH" 2>&1)
          PUSH_STATUS=$?
          set -e

          if [ $PUSH_STATUS -ne 0 ]; then
            echo "::error::Push test failed! The token lacks permission to push workflow files."
            echo "::error::Output: $PUSH_OUT"
            echo ""
            echo "--------------------------------------------------------------------------------"
            echo "❌ ERROR: Cannot push commits that touch workflow files without 'workflow' scope."
            echo "Please create a Personal Access Token (PAT) with 'repo' and 'workflow' scopes"
            echo "and add it as a repository secret named 'WORKFLOW_TOKEN'."
            echo "--------------------------------------------------------------------------------"
            git checkout -
            git branch -D "$TEST_BRANCH"
            exit 1
          fi

          # Clean up remote test branch and local branch
          git push origin --delete "$TEST_BRANCH"
          git checkout -
          git branch -D "$TEST_BRANCH"
          echo "✅ Git write and workflow permissions verified successfully!"

      - name: Push safety snapshot tag
        if: steps.check_upstream.outputs.skip_rebase != 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          BACKUP_TAG="backup/subprofiles-$(date +'%Y%m%d-%H%M%S')"
          echo "Creating safety tag $BACKUP_TAG..."
          git tag "$BACKUP_TAG"
          git push origin "$BACKUP_TAG"
          echo "backup_tag=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain (WASM Codegen)
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          targets: wasm32-unknown-unknown

      - name: Set up pnpm
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: pnpm install --frozen-lockfile

      - name: Pre-build & generate workspace assets
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Pre-generating config..."
          pnpm --filter @fluxer/config generate
          echo "Pre-compiling app wasm parser..."
          pnpm --filter fluxer_app wasm:codegen
          echo "Pre-compiling i18n locales..."
          pnpm --filter fluxer_app lingui:compile
          echo "Pre-generating UI masks, message layout, theme variables, and CSS types..."
          pnpm --filter fluxer_app generate:masks
          pnpm --filter fluxer_app generate:colors
          pnpm --filter fluxer_app generate:message-layout
          pnpm --filter fluxer_app generate:theme-variables
          pnpm --filter fluxer_app generate:css-types

      - name: Run Baseline Pre-Rebase Test Gate
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Running baseline test verification on features/subprofiles before rebase..."
          pnpm --filter @fluxer/schema test src/domains/persona/
          pnpm --filter fluxer_app test src/features/persona/ src/features/messaging/models/MessagingMessagePersona.test.ts
          pnpm --filter fluxer_api test src/api/persona/tests/ src/api/channel/tests/MessagePersona.test.ts src/api/user/tests/PersonaAvatarUpload.test.ts

      - name: Attempt Git Rebase against upstream/main
        id: attempt_rebase
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          set +e
          git rebase upstream/main
          REBASE_EXIT=$?
          if [ $REBASE_EXIT -ne 0 ]; then
            echo "Conflicts detected during rebase."
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "Clean rebase! No conflicts encountered."
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage 1 - Gemini Flash Conflict Resolution
        if: steps.attempt_rebase.outputs.has_conflicts == 'true'
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Invoking Gemini 3.8 Flash Rebase Agent..."
          python /tmp/rebase_tools/rebase_agent.py

      - name: Run Post-Rebase Test Verification Gate
        id: test_gate
        if: steps.check_upstream.outputs.skip_rebase != 'true'
        run: |
          echo "Running Schema and Persona test suites..."
          pnpm --filter @fluxer/schema test src/domains/persona/
          pnpm --filter fluxer_app test src/features/persona/ src/features/messaging/models/MessagingMessagePersona.test.ts
          pnpm --filter fluxer_api test src/api/persona/tests/ src/api/channel/tests/MessagePersona.test.ts src/api/user/tests/PersonaAvatarUpload.test.ts

      - name: Push Rebased Branch
        if: steps.check_upstream.outputs.skip_rebase != 'true' && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          git push --force-with-lease origin features/subprofiles
          echo "Successfully rebased and pushed features/subprofiles."

      - name: Stage 2 - Escalate to Human Developer on Failure
        if: (failure() || cancelled()) && steps.check_upstream.outputs.skip_rebase != 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git rebase --abort 2>/dev/null || true
          
          ESCALATION_CONTENT=""
          if [ -f /tmp/rebase_escalation_reason.md ]; then
            ESCALATION_CONTENT=$(cat /tmp/rebase_escalation_reason.md)
          else
            ESCALATION_CONTENT="The AI agent encountered conflicts, rate limits, or test failures that could not be resolved automatically."
          fi

          ISSUE_BODY=$(cat <<EOF
          Hey @chiaracoetzee! 👋

          The automated nightly rebase of \`features/subprofiles\` against \`upstream/main\` requires human intervention.

          ### 🤖 AI Diagnosis & Reason for Escalation
          $ESCALATION_CONTENT

          ### Details
          - **Workflow Run**: [View GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Safety Backup Tag**: \`${{ env.backup_tag || 'None created' }}\`

          The rebase has been aborted to protect your branch. Your remote branch has **not** been modified.
          EOF
          )

          gh repo set-default "${{ github.repository }}" 2>/dev/null || true

          gh label create "needs-rebase" --repo "${{ github.repository }}" --color "d73a4a" --description "Rebase conflicts require human intervention" 2>/dev/null || true

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ Nightly Rebase Failed: Human Intervention Required ($(date +'%Y-%m-%d'))" \
            --body "$ISSUE_BODY" \
            --assignee chiaracoetzee \
            --label "needs-rebase" 2>/dev/null || \
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ Nightly Rebase Failed: Human Intervention Required ($(date +'%Y-%m-%d'))" \
            --body "$ISSUE_BODY" \
            --assignee chiaracoetzee

      - name: Upload AI Agent Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebase-agent-logs
          path: |
            /tmp/rebase_transcript.md
            /tmp/rebase_escalation_reason.md
            /tmp/antigravity_data
            /tmp/rebase_tools
