x-build-cache: &build-cache
  cache_from:
    - type=gha
  cache_to:
    - type=gha,mode=max,ignore-error=true

services:
  api:
    build:
      context: ..
      dockerfile: fluxer_api/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-api:bleeding-edge

  app-proxy:
    build:
      context: ..
      dockerfile: fluxer_app_proxy/Dockerfile
      args:
        PRECOMPRESS_BROTLI_QUALITY: "4"
      <<: *build-cache
    image: fluxer-custom/fluxer-app-proxy-self-hosted:bleeding-edge

  messages:
    build:
      context: ..
      dockerfile: fluxer_messages/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-messages:bleeding-edge

  static-proxy:
    build:
      context: ..
      dockerfile: fluxer_static/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-static:bleeding-edge

  snowflakes:
    build:
      context: ..
      dockerfile: fluxer_snowflakes/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-snowflakes:bleeding-edge

  users:
    build:
      context: ..
      dockerfile: fluxer_users/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-users:bleeding-edge

  media-proxy:
    build:
      context: ..
      dockerfile: fluxer_media_proxy/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-media-proxy:bleeding-edge

  gateway:
    build:
      context: ..
      dockerfile: fluxer_gateway/Dockerfile
      <<: *build-cache
    image: fluxer-custom/fluxer-gateway:bleeding-edge
