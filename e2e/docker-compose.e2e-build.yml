services:
  api:
    build:
      context: ..
      dockerfile: fluxer_api/Dockerfile
      cache_from:
        - type=gha,scope=api
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=api
    image: fluxer-custom/fluxer-api:bleeding-edge

  app-proxy:
    build:
      context: ..
      dockerfile: fluxer_app_proxy/Dockerfile
      args:
        PRECOMPRESS_BROTLI_QUALITY: "4"
      cache_from:
        - type=gha,scope=app-proxy
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=app-proxy
    image: fluxer-custom/fluxer-app-proxy-self-hosted:bleeding-edge

  messages:
    build:
      context: ..
      dockerfile: fluxer_messages/Dockerfile
      cache_from:
        - type=gha,scope=messages
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=messages
    image: fluxer-custom/fluxer-messages:bleeding-edge

  static-proxy:
    build:
      context: ..
      dockerfile: fluxer_static/Dockerfile
      cache_from:
        - type=gha,scope=static-proxy
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=static-proxy
    image: fluxer-custom/fluxer-static:bleeding-edge

  snowflakes:
    build:
      context: ..
      dockerfile: fluxer_snowflakes/Dockerfile
      cache_from:
        - type=gha,scope=snowflakes
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=snowflakes
    image: fluxer-custom/fluxer-snowflakes:bleeding-edge

  users:
    build:
      context: ..
      dockerfile: fluxer_users/Dockerfile
      cache_from:
        - type=gha,scope=users
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=users
    image: fluxer-custom/fluxer-users:bleeding-edge

  media-proxy:
    build:
      context: ..
      dockerfile: fluxer_media_proxy/Dockerfile
      cache_from:
        - type=gha,scope=media-proxy
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=media-proxy
    image: fluxer-custom/fluxer-media-proxy:bleeding-edge

  gateway:
    build:
      context: ..
      dockerfile: fluxer_gateway/Dockerfile
      cache_from:
        - type=gha,scope=gateway
      cache_to:
        - type=gha,mode=max,ignore-error=true,scope=gateway
    image: fluxer-custom/fluxer-gateway:bleeding-edge
